{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dashboard{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-500: #c5161d;
            --primary-600: #a40f15;
            --primary-soft: rgba(197, 22, 29, 0.12);
            --accent-rose: #f05b6d;
            --accent-amber: #ffb347;
            --accent-green: #2bb673;
            --accent-blue: #3b82f6;
            --accent-purple: #a855f7;
            --text-strong: #1f1414;
            --text-muted: #6b4c4c;
            --surface: #ffffff;
            --surface-muted: #fff7f5;
            --border-subtle: rgba(197, 22, 29, 0.15);
            --shadow-soft: 0 25px 55px rgba(197, 22, 29, 0.12);
            --bg-top: #ffffff;
            --bg-mid: #fffaf8;
            --bg-bottom: #ffeceb;
            --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font-sans);
            color: var(--text-strong);
            background:
                radial-gradient(110% 80% at 85% 0%, rgba(197, 22, 29, 0.12), transparent 55%),
                radial-gradient(85% 65% at 5% 15%, rgba(255, 214, 214, 0.7), transparent 65%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-bottom) 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(60% 60% at 60% -10%, rgba(255, 255, 255, 0.6), transparent 65%);
            pointer-events: none;
            z-index: 0;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .dashboard-shell {
            min-height: 100vh;
            padding: clamp(2rem, 5vw, 3.75rem);
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .dashboard-container {
            width: min(1220px, 100%);
            display: flex;
            flex-direction: column;
            gap: clamp(2rem, 4vw, 3rem);
        }

        .dashboard-card {
            background: var(--surface);
            border-radius: 22px;
            padding: clamp(1.5rem, 2vw, 2rem);
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-subtle);
        }

        .dashboard-card--ghost {
            background: var(--surface-muted);
            border: 1px solid rgba(197, 22, 29, 0.08);
        }

        .metric-grid {
            display: grid;
            gap: 1.5rem;
            align-items: stretch;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        }

        @media (min-width: 1200px) {
            .metric-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 720px) {
            .dashboard-shell {
                padding: 1.5rem;
            }

            .metric-grid {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <main class="dashboard-shell">
        <div class="dashboard-container">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
