{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dashboard{% endblock %}</title>
    <style>
        :root {
            --primary-500: #1a4dff;
            --primary-600: #103ace;
            --primary-soft: rgba(26, 77, 255, 0.12);
            --accent-rose: #f472b6;
            --accent-amber: #f59e0b;
            --accent-green: #22c55e;
            --accent-blue: #38bdf8;
            --accent-purple: #8b5cf6;
            --text-strong: #0f172a;
            --text-muted: #475569;
            --surface: #ffffff;
            --surface-muted: rgba(255, 255, 255, 0.6);
            --border-subtle: #e2e8f0;
            --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.08);
            --font-sans: "Segoe UI", "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font-sans);
            color: var(--text-strong);
            background: radial-gradient(circle at 0% -20%, rgba(26, 77, 255, 0.14), transparent 55%),
                        radial-gradient(circle at 100% 0%, rgba(139, 92, 246, 0.15), transparent 60%),
                        #f1f5f9;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .dashboard-shell {
            min-height: 100vh;
            padding: clamp(2rem, 5vw, 3.75rem);
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: min(1220px, 100%);
            display: flex;
            flex-direction: column;
            gap: clamp(2rem, 4vw, 3rem);
        }

        .dashboard-card {
            background: var(--surface);
            border-radius: 22px;
            padding: clamp(1.5rem, 2vw, 2rem);
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(148, 163, 184, 0.16);
        }

        .dashboard-card--ghost {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(16px);
        }

        .metric-grid {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        }

        @media (max-width: 720px) {
            .dashboard-shell {
                padding: 1.5rem;
            }

            .metric-grid {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <main class="dashboard-shell">
        <div class="dashboard-container">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
